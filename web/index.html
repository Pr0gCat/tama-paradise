<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tama">
<meta name="theme-color" content="#222">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Tama Paradise</title>
<style>
  :root { --bg: #222; --btn: #3a3a44; --btn-on: #5a5a6a; --fg: #ccc; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    box-sizing: border-box; overflow: hidden;
    /* no double-tap zoom, text selection or tap flash while playing */
    touch-action: manipulation; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  /* square screen: as large as fits next to the controls */
  canvas { width: min(92vw, 100dvh - 280px, 384px); aspect-ratio: 1; image-rendering: pixelated;
           border-radius: 12px; touch-action: none; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px 14px; justify-content: center; }
  button { height: 56px; border: 0; border-radius: 28px; background: var(--btn); color: var(--fg);
           font: 600 20px system-ui; touch-action: none; }
  button.on { background: var(--btn-on); }
  pre { margin: 0; font-size: 12px; text-align: center; min-height: 3em; }
  pre[hidden] { display: none; }
  button.small { height: 32px; padding: 0 16px; font-size: 14px; border-radius: 16px; }
  .row { display: flex; gap: 8px; }
  .row[hidden] { display: none; }
  dialog { background: #2c2c34; color: var(--fg); border: 0; border-radius: 12px; width: min(92vw, 360px);
           max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 16px); overflow: auto;
           margin: max(8px, env(safe-area-inset-top)) auto auto; }
  dialog h2 { margin: 0 0 8px; font: 600 18px system-ui; outline: none; }
  dialog p { font: 14px system-ui; }
  #saves button { display: block; margin: 8px 0; }
  #saves [hidden] { display: none; }
  #setup button { display: block; margin: 8px 0; }
  #setup [hidden] { display: none; }
  /* Off-screen field that brings up the phone keyboard for typed text (the planet name). */
  #kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px;
    border: 0; padding: 0; pointer-events: none; }
  dialog label { display: block; margin: 8px 0 4px; font: 14px system-ui; }
  dialog input, dialog select { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px;
    /* 16px: iOS zooms the page into any focused field set smaller */
    font: 16px ui-monospace, monospace; background: #1c1c22; color: var(--fg); border: 1px solid #555; border-radius: 6px; }
  dialog .check input { display: inline; width: auto; }
  canvas.qr { display: block; width: 168px; height: 168px; margin: 8px auto; image-rendering: pixelated;
              border-radius: 4px; }
  canvas.qr[hidden] { display: none; }
  dialog hr { border: 0; border-top: 1px solid #444; margin: 12px 0; }
  .inline { display: flex; gap: 8px; align-items: center; }
  #scanner { position: fixed; inset: 0; height: 100lvh; z-index: 10; background: #000; display: flex;
             flex-direction: column; align-items: center; justify-content: center; gap: 16px; font: 16px system-ui; }
  #scanner[hidden] { display: none; }
  #scanner video { width: min(92vw, 70dvh); aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
  /* phone held upright: the screen edge to edge, no rounded frame */
  @media (orientation: portrait) and (max-width: 600px) {
    canvas { width: min(100vw, 100dvh - 280px); border-radius: 0; }
  }
  /* home-screen app held upright: the screen at the top, bigger buttons down by the thumbs */
  @media (display-mode: standalone) and (orientation: portrait) {
    body { justify-content: flex-start; padding-top: env(safe-area-inset-top);
           padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .pad { margin-top: auto; grid-template-columns: repeat(3, min(96px, 26vw)); gap: 14px 18px; }
    .pad button { height: 72px; border-radius: 36px; font-size: 26px; }
    canvas { width: min(100vw, 100dvh - 320px, 512px); border-radius: 0; }
  }
  /* phone held sideways: the screen on the left, the controls beside it */
  @media (orientation: landscape) and (max-height: 500px) {
    body { display: grid; grid-template-columns: auto auto; align-content: center; justify-content: center;
           gap: 12px 24px; padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
    canvas { width: min(100dvh - 16px, 55vw); grid-column: 1; grid-row: 1 / span 3; }
    .pad, .row, pre { grid-column: 2; }
  }
</style>
<canvas id="c" aria-label="Pet screen. Swipe left or right to turn the dial, tap to press it."></canvas>
<div class="pad">
  <button data-k="0x40" aria-label="Dial left">◀</button>
  <button data-k="0x08" aria-label="Dial press">●</button>
  <button data-k="0x80" aria-label="Dial right">▶</button>
  <button data-k="0x01">A</button>
  <button data-k="0x02">B</button>
  <button data-k="0x04">C</button>
</div>
<div class="row"><button id="mute" class="small" aria-pressed="false">♪ sound on</button>
  <button id="alerts" class="small" aria-pressed="false">🔔 alerts off</button>
  <button id="friends-btn" class="small" aria-expanded="false">Friends</button></div>
<div class="row" id="kbd-row" hidden><button id="kbd-btn" class="small">⌨ Keyboard</button></div>
<input id="kbd" aria-label="Type the planet name" autocomplete="off" autocorrect="off"
  autocapitalize="characters" spellcheck="false" enterkeyhint="done" tabindex="-1">
<dialog id="friends">
  <form method="dialog">
    <h2 tabindex="-1" autofocus>Friends</h2>
    <label>Your friend code<input id="my-code" readonly></label>
    <canvas id="my-qr" class="qr" aria-label="QR code of your friend code"></canvas>
    <button type="button" id="copy-code" class="small">Copy</button>
    <label>Friend's code<input id="their-code" autocomplete="off" spellcheck="false" placeholder="TP1-…"></label>
    <button type="button" class="small scan" data-field="their-code">📷 Scan QR</button>
    <label class="check"><input type="checkbox" id="marry"> Agree to marry (adults, best friends)</label>
    <button type="button" id="play" class="small">Playdate</button>
    <hr>
    <label>Gift an item<select id="gift-item"></select></label>
    <button type="button" id="gift" class="small">Make gift code</button>
    <input id="gift-code" readonly>
    <canvas id="gift-qr" class="qr" hidden aria-label="QR code of the gift"></canvas>
    <label>Receive a gift<input id="recv-code" autocomplete="off" spellcheck="false" placeholder="TG1-…"></label>
    <button type="button" class="small scan" data-field="recv-code">📷 Scan QR</button>
    <button type="button" id="recv" class="small">Receive</button>
    <p id="friends-msg" role="status"></p>
    <button class="small">Close</button>
  </form>
</dialog>
<dialog id="saves">
  <form method="dialog">
    <h2 tabindex="-1" autofocus>Save data</h2>
    <p id="saves-text"></p>
    <button type="button" class="small" id="save-export">Save to a file</button>
    <button type="button" class="small" id="save-import">Choose a save file</button>
    <input type="file" id="save-file" accept=".json,application/json" hidden>
    <p id="saves-msg" role="status"></p>
    <button class="small">Close</button>
  </form>
</dialog>
<dialog id="setup">
  <h2>Your Tamagotchi Paradise</h2>
  <p>This page brings no game data of its own. It reads the graphics and texts from a flash dump of
    your own Tamagotchi Paradise, kept only in this browser.</p>
  <button type="button" class="small" id="setup-pick">Choose the dump file (.bin)</button>
  <input type="file" id="setup-file" accept=".bin,application/octet-stream" hidden>
  <p id="setup-msg" role="status"></p>
</dialog>
<pre id="s" hidden></pre>
<div id="scanner" hidden>
  <video playsinline muted></video>
  <p id="scan-msg">Point the camera at your friend's QR code</p>
  <button type="button" class="small" id="scan-stop">Cancel</button>
</div>
<script type="module">
  // The glue is revalidated like the wasm, so an updated build never pairs with a stale glue.
  const glue = await (await fetch("./pkg/tama_web.js", { cache: "no-cache" })).text();
  const { default: init, Tama, Dump, qr, set_build } = await import(URL.createObjectURL(new Blob([glue], { type: "text/javascript" })));
  // Revalidate the engine and data on every load (cheap 304s) so a rebuilt game is never stale.
  await init({ module_or_path: fetch("./pkg/tama_web_bg.wasm", { cache: "no-cache" }) });
  const params = new URLSearchParams(location.search);
  // The pet's numbers under the controls are for testing (?debug).
  const debugStatus = params.has("debug") ? document.getElementById("s") : null;
  if (debugStatus) debugStatus.hidden = false;
  // ?speed=60 runs the pet clock 60x faster for testing (kept in its own save slot).
  const speed = Number(params.get("speed")) || 1;
  const KEY = speed === 1 ? "tama-save" : "tama-save-speed";
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  };
  const localSecs = () => Date.now() / 1000 - new Date().getTimezoneOffset() * 60;
  // ?hours=N shifts the clock for testing (debug only).
  const shift = params.has("debug") ? (Number(params.get("hours")) || 0) * 3600 : 0;
  const t0 = localSecs() + shift, wall0 = performance.now();
  // Game data: a local build serves data/game.json and the sprites (development; ?dump skips
  // them); otherwise it all comes from the player's own flash dump, kept in IndexedDB.
  let dump = null, data = null;
  if (!params.has("dump")) {
    try {
      const res = await fetch("game.json", { cache: "no-cache" });
      if (res.ok) data = await res.text();
    } catch {}
  }
  if (!data) ({ dump, data } = await openDump());
  let game;
  const saved = store.get();
  if (saved) {
    try { game = Tama.load(data, saved); } catch (e) { console.warn("save ignored:", e); }
  }
  game ??= new Tama(data, Date.now() >>> 0);
  // ?reset = the original's cold start (new battery): CONTINUE or RESET ALL.
  if (params.has("reset") && saved) game.begin_delete();
  game.advance_to(t0); // catches up the time the page was closed (max 24 h)
  const save = () => store.set(game.save());
  // ?debug: window.tama.get() returns the save as an object, window.tama.set(obj) replaces the game.
  if (params.has("debug")) {
    window.soundLog = [];
    window.tama = {
      get: () => JSON.parse(game.save()),
      set: obj => { game = Tama.load(data, JSON.stringify(obj)); save(); },
    };
  }
  addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => document.hidden && save());
  setInterval(save, 10_000);
  const w = Tama.width(), h = Tama.height(), tickMs = Tama.tick_ms();
  const c = document.getElementById("c");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  // Input bits as in the firmware. Buttons are held; dial turns are one-frame pulses.
  // Every press is also latched for one frame, so a tap shorter than a frame still counts.
  const A = 1, B = 2, C = 4, PUSH = 8, DOWN = 0x40, UP = 0x80, DIAL = DOWN | UP;
  const keys = { a: A, s: B, d: C, " ": PUSH, Enter: PUSH, ArrowLeft: DOWN, ArrowRight: UP };
  let held = 0, pulses = 0;
  // Holding a dial key (or a finger after a swipe) keeps turning: after 300 ms, a step every 2
  // frames (the remake's addition; a real dial is turned, not held).
  let dialHeld = 0, dialSince = 0, dialTick = 0;
  const down = bit => {
    pulses |= bit;
    if (bit & DIAL) { dialHeld = bit; dialSince = performance.now(); } else held |= bit;
  };
  const up = bit => { held &= ~bit; if (bit & dialHeld) dialHeld = 0; save(); };
  // Typed text (the planet name) takes the keyboard: letters, digits, space, Backspace, arrows,
  // Enter; Esc is C. The phone keyboard comes from the hidden #kbd field (⌨ or a tap on the screen).
  const kbd = document.getElementById("kbd"), kbdBtn = document.getElementById("kbd-btn");
  const kbdRow = document.getElementById("kbd-row");
  const typing = e => e.target !== kbd && e.target.closest?.("input, select, textarea, dialog");
  addEventListener("keydown", e => {
    if (typing(e)) return;
    if (game.text_entry()) {
      if (e.key === "Escape") { down(C); up(C); e.preventDefault(); return; }
      // In #kbd only Enter comes here; characters arrive as input (phone keyboards send no keys).
      if ((e.target !== kbd || e.key === "Enter") && game.type_key(e.key)) { e.preventDefault(); return; }
      if (e.target === kbd) return;
    }
    if (e.key in keys && !e.repeat) { down(keys[e.key]); e.preventDefault(); }
  });
  addEventListener("keyup", e => !typing(e) && e.key in keys && up(keys[e.key]));
  // #kbd holds one placeholder character, so a Backspace on the phone still shows up as an edit.
  const kbdReset = () => { kbd.value = "#"; kbd.setSelectionRange(1, 1); };
  kbd.addEventListener("focus", kbdReset);
  const kbdRead = () => {
    const v = kbd.value;
    if (!v.startsWith("#")) game.type_key("Backspace");
    for (const ch of v.replace(/^#/, "")) game.type_key(ch);
    kbdReset();
  };
  kbd.addEventListener("input", e => { if (!e.isComposing) kbdRead(); });
  kbd.addEventListener("compositionend", kbdRead);
  kbdBtn.onclick = () => kbd.focus();
  for (const el of document.querySelectorAll("button[data-k]")) {
    const bit = Number(el.dataset.k);
    el.onpointerdown = e => { el.setPointerCapture(e.pointerId); el.classList.add("on"); down(bit); navigator.vibrate?.(8); };
    el.onpointerup = el.onpointercancel = () => { el.classList.remove("on"); up(bit); };
    el.oncontextmenu = e => e.preventDefault();
  }
  // Touch screen: swipe sideways turns the dial (one step per 24 px), a tap presses it. Holding
  // the finger after a swipe keeps turning that way, like holding a dial key.
  let swipeX = null, swiped = false;
  // Off in SETTINGS → TOUCH OFF.
  c.onpointerdown = e => {
    if (game.text_entry()) { kbd.focus(); return; }
    if (!game.touch()) return;
    c.setPointerCapture(e.pointerId); swipeX = e.clientX; swiped = false;
  };
  c.onpointermove = e => {
    if (swipeX === null) return;
    const dx = e.clientX - swipeX;
    if (Math.abs(dx) >= 24) { down(dx > 0 ? UP : DOWN); swipeX = e.clientX; swiped = true; }
  };
  c.onpointerup = () => {
    if (swipeX !== null && !swiped) { down(PUSH); up(PUSH); }
    swipeX = null; dialHeld = 0;
  };
  c.onpointercancel = () => { swipeX = null; dialHeld = 0; };
  // Friends: exchange friend codes / gift codes as text or QR (the original uses a link cable).
  // The QR holds a link to this page with the code, so a phone's camera app opens the game with it.
  const $ = id => document.getElementById(id);
  const link = (kind, code) => `${location.origin}${location.pathname}?${kind}=${encodeURIComponent(code)}`;
  function drawQr(canvas, text) {
    const m = qr(text), n = m[0], q = 4, size = n + 2 * q;
    canvas.width = canvas.height = size;
    const c = canvas.getContext("2d");
    c.fillStyle = "#fff"; c.fillRect(0, 0, size, size); c.fillStyle = "#000";
    for (let i = 0; i < n * n; i++) if (m[1 + i]) c.fillRect(q + i % n, q + Math.floor(i / n), 1, 1);
    canvas.hidden = false;
  }
  const dlg = $("friends"), msg = t => { $("friends-msg").textContent = t; };
  $("friends-btn").onclick = () => {
    $("my-code").value = game.friend_code();
    drawQr($("my-qr"), link("friend", $("my-code").value));
    $("gift-item").replaceChildren(...JSON.parse(game.inventory()).map(([id, n, name]) => new Option(`${name || id} ×${n}`, id)));
    msg(""); dlg.showModal();
  };
  $("copy-code").onclick = () => navigator.clipboard?.writeText($("my-code").value).then(() => msg("Copied"), () => msg("Copy failed"));
  $("play").onclick = () => {
    try { game.playdate($("their-code").value, $("marry").checked); save(); dlg.close(); }
    catch (e) { msg(e.message ?? String(e)); }
  };
  $("gift").onclick = () => {
    const code = game.gift(Number($("gift-item").value));
    $("gift-code").value = code; msg(code ? "Send this code or QR to your friend" : "Nothing to give"); save();
    if (code) drawQr($("gift-qr"), link("gift", code)); else $("gift-qr").hidden = true;
  };
  $("recv").onclick = () => {
    const id = game.receive_gift($("recv-code").value);
    if (id) { save(); dlg.close(); } else msg("Invalid or already used code");
  };

  // The game's own CONNECTION menu (planet level) opens this panel for the chosen entry.
  // SETTINGS → SAVE DATA in the game: the file part happens here (sharing and file pickers need a
  // tap on the page itself).
  const saves = $("saves"), saveMsg = t => { $("saves-msg").textContent = t; };
  function openSaves(exporting) {
    $("saves-text").textContent = exporting
      ? "Keep a copy of your pet, or move it to another browser or the home-screen app."
      : "Load a save file. The pet you have now is replaced.";
    $("save-export").hidden = !exporting; $("save-import").hidden = exporting;
    saveMsg(""); saves.showModal();
  }
  $("save-export").onclick = async () => {
    const day = new Date().toISOString().slice(0, 10);
    const file = new File([game.save()], `tama-paradise-${day}.json`, { type: "application/json" });
    try {
      if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file] }); }
      else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      saveMsg("Saved");
    } catch (e) { if (e.name !== "AbortError") saveMsg(`Could not save: ${e.message ?? e}`); }
  };
  $("save-import").onclick = () => $("save-file").click();
  $("save-file").onchange = async () => {
    const f = $("save-file").files[0]; $("save-file").value = "";
    if (!f) return;
    try { game = Tama.load(data, await f.text()); save(); saves.close(); }
    catch (e) { saveMsg(`Not a save file: ${e.message ?? e}`); }
  };

  function connect(req) {
    if (req === "save-export" || req === "save-import") { openSaves(req === "save-export"); return; }
    $("friends-btn").click();
    if (req.startsWith("gift:")) {
      const code = req.slice(5);
      $("gift-code").value = code; drawQr($("gift-qr"), link("gift", code)); save();
      msg("Send this gift code or QR to your friend");
    } else if (req === "playdate") {
      $("their-code").focus(); msg("Show your code to your friend and enter theirs, then press Playdate");
    } else {
      $("recv-code").focus(); msg("Enter a gift code from your friend");
    }
  }

  // Scan a friend's QR with the camera (a home-screen app on iOS does not receive the QR's link):
  // BarcodeDetector where the browser has it, else the bundled jsQR decoder.
  const scanner = $("scanner"), video = scanner.querySelector("video");
  let stream = null;
  // The friends dialog sits in the top layer, so it steps aside while the camera is up.
  const stopScan = () => {
    stream?.getTracks().forEach(t => t.stop()); stream = null;
    if (!scanner.hidden) { scanner.hidden = true; dlg.showModal(); }
  };
  $("scan-stop").onclick = stopScan;
  const loadJsQr = () => window.jsQR ? Promise.resolve() : new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = "vendor/jsQR.js"; s.onload = ok; s.onerror = fail;
    document.head.append(s);
  });
  // A scanned text is this page's link (?friend= / ?gift=) or a bare code.
  const codeFrom = text => {
    try { const u = new URL(text); return u.searchParams.get("friend") ?? u.searchParams.get("gift") ?? text; }
    catch { return text.trim(); }
  };
  for (const btn of document.querySelectorAll("button.scan")) btn.onclick = async () => {
    if (!navigator.mediaDevices?.getUserMedia) { msg("The camera needs HTTPS (or localhost)"); return; }
    try {
      const detector = "BarcodeDetector" in window ? new BarcodeDetector({ formats: ["qr_code"] }) : null;
      if (!detector) await loadJsQr();
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = stream; dlg.close(); scanner.hidden = false; await video.play();
      const grab = document.createElement("canvas"), g = grab.getContext("2d", { willReadFrequently: true });
      while (stream) {
        await new Promise(r => setTimeout(r, 150));
        if (!video.videoWidth) continue;
        let text = null;
        if (detector) {
          text = (await detector.detect(video))[0]?.rawValue ?? null;
        } else {
          grab.width = video.videoWidth; grab.height = video.videoHeight;
          g.drawImage(video, 0, 0);
          text = jsQR(g.getImageData(0, 0, grab.width, grab.height).data, grab.width, grab.height)?.data ?? null;
        }
        if (!text) continue;
        stopScan();
        const field = $(btn.dataset.field);
        field.value = codeFrom(text);
        navigator.vibrate?.(30);
        msg(btn.dataset.field === "their-code" ? "Press Playdate to play with your friend" : "Press Receive to get the gift");
      }
    } catch (e) {
      stopScan();
      msg(e.name === "NotAllowedError" ? "Camera permission was denied" : `Camera error: ${e.message ?? e}`);
    }
  };

  // Opened from a scanned QR: fill in the code and show the panel (the link is then cleaned up).
  for (const [kind, field] of [["friend", "their-code"], ["gift", "recv-code"]]) {
    const code = params.get(kind);
    if (!code) continue;
    $("friends-btn").click();
    $(field).value = code;
    msg(kind === "friend" ? "Press Playdate to play with your friend" : "Press Receive to get the gift");
    params.delete(kind);
    history.replaceState(null, "", `${location.pathname}${params.size ? "?" + params : ""}`);
  }

  // Sound: the original is a single-voice buzzer playing square-wave melodies (10% duty).
  const melodies = JSON.parse(data).melodies ?? [];
  let audio = null, voice = null;
  let muted = (() => { try { return localStorage.getItem("tama-muted") === "1"; } catch { return false; } })();
  const muteBtn = document.getElementById("mute");
  const showMute = () => { muteBtn.textContent = muted ? "♪ sound off" : "♪ sound on"; muteBtn.setAttribute("aria-pressed", muted); };
  showMute();
  muteBtn.onclick = () => {
    muted = !muted; showMute();
    try { localStorage.setItem("tama-muted", muted ? "1" : "0"); } catch {}
    if (muted) voice?.osc.stop();
  };
  // Care calls light the original's screen; here a notification does it while the page is hidden.
  const CALLS = { 0x0f: "wants to see you", 0x11: "is hungry", 0x12: "is unhappy", 0x0a: "has a cold",
    0x13: "is ready to evolve", 0x1c: "is up to something" };
  const alertsBtn = document.getElementById("alerts");
  // Phones pause hidden pages and need a service worker to notify, so the toggle is desktop only.
  alertsBtn.hidden = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  let alerts = (() => { try { return localStorage.getItem("tama-alerts") === "1"; } catch { return false; } })();
  const canNotify = () => "Notification" in window && Notification.permission === "granted";
  const showAlerts = () => {
    const on = alerts && canNotify();
    alertsBtn.textContent = on ? "🔔 alerts on" : "🔔 alerts off"; alertsBtn.setAttribute("aria-pressed", on);
  };
  showAlerts();
  alertsBtn.onclick = async () => {
    if (!("Notification" in window)) { alertsBtn.textContent = "🔔 not supported"; return; }
    alerts = !(alerts && canNotify());
    if (alerts && Notification.permission !== "granted") alerts = (await Notification.requestPermission()) === "granted";
    try { localStorage.setItem("tama-alerts", alerts ? "1" : "0"); } catch {}
    showAlerts();
  };
  setInterval(() => {
    if (!document.hidden || !alerts || !canNotify()) return;
    const id = game.poll_call(t0 + (performance.now() - wall0) / 1000 * speed);
    if (id === undefined) return;
    try {
      const n = new Notification("Tamagotchi Paradise", { body: `Your Tamagotchi ${CALLS[id] ?? "is calling"}!`, tag: "tama-call" });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { console.warn("notification:", e); }
  }, 10_000);
  // Browsers only allow audio after a user gesture.
  // iOS: "playback" keeps the sounds on with the silent switch set (iOS 17+); the context is
  // suspended or "interrupted" after a lock or app switch, so every gesture and return resumes it.
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  const unlock = () => {
    if (!audio || audio.state === "closed") audio = new AudioContext();
    if (audio.state !== "running") audio.resume().catch(() => {});
  };
  for (const ev of ["pointerdown", "touchend", "keydown"]) addEventListener(ev, unlock);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && audio) audio.resume().catch(() => {}); });
  function pulseWave(duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = 2 * Math.sin(Math.PI * k * duty) / (Math.PI * k);
    return audio.createPeriodicWave(re, im);
  }
  function playMelody(id, vol) {
    const m = melodies[id];
    if (!m || !audio || muted) return;
    // Not running yet (resuming after a lock): the notes wait on the context's clock.
    if (audio.state !== "running") audio.resume().catch(() => {});
    voice?.osc.stop();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.setPeriodicWave(pulseWave(0.1));
    osc.connect(gain).connect(audio.destination);
    // Silent until the first note: the gain otherwise starts at 1 and the oscillator at 440 Hz,
    // which clicks before every sound.
    const start = audio.currentTime + 0.01;
    gain.gain.setValueAtTime(0, audio.currentTime);
    let t = start;
    for (const [steps, period, duty] of m.notes) {
      const on = period > 0 && duty > 0;
      if (on) osc.frequency.setValueAtTime(1e6 / period, t);
      gain.gain.setValueAtTime(on ? 0.25 * vol / 100 : 0, t);
      t += steps * m.ms_per_step / 1000;
    }
    osc.start(start); osc.stop(t);
    voice = { osc };
  }

  // Sprites are fetched on demand; the core asks for what the current screen needs.
  const loading = new Set();
  async function loadSprite(id) {
    loading.add(id);
    try {
      let raw;
      if (dump) {
        raw = dump.sprite(id);
      } else {
        const res = await fetch(`sprites/${id}.tsp.gz`);
        if (!res.ok) throw new Error(res.status);
        raw = new Uint8Array(await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
      }
      if (!game.add_sprite(id, raw)) throw new Error("bad sprite");
    } catch (e) {
      console.warn(`sprite ${id}:`, e);  // stays in `loading`, so it is not retried every frame
      return;
    }
    loading.delete(id);
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    // A throttled background tab must not fast-forward the animations when it comes back.
    acc = Math.min(acc + now - last, 5 * tickMs); last = now;
    const n = Math.floor(acc / tickMs);
    acc -= n * tickMs;
    if (n) {
      const t = t0 + (now - wall0) / 1000 * speed;
      for (let i = 0; i < Math.min(n, 5); i++) {
        if (dialHeld && now - dialSince > 300 && ++dialTick % 2 === 0) pulses |= dialHeld;
        game.frame(t, held | pulses); pulses = 0;
      }
      if (debugStatus) debugStatus.textContent = game.status();
      const entry = game.text_entry();
      kbdRow.hidden = !entry;
      if (!entry && document.activeElement === kbd) kbd.blur();
      for (const id of game.missing_sprites()) if (!loading.has(id)) loadSprite(id);
      const req = game.take_connect();
      if (req) connect(req);
      const sounds = game.take_sounds();
      if (sounds.length) { const s = sounds[sounds.length - 1]; playMelody(s >> 8, s & 0xff); }
      if (window.soundLog) for (const s of sounds) window.soundLog.push(s >> 8);
    }
    ctx.putImageData(new ImageData(new Uint8ClampedArray(game.framebuffer()), w, h), 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // Home-screen app: cache everything for offline play.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(e => console.warn("sw:", e));
  }
  // A published build carries version.txt (the commit). When it changes, save and reload, so an
  // open page or home-screen app picks up a new build on its own.
  const version = () => fetch("version.txt", { cache: "no-store" }).then(r => r.ok ? r.text() : null).catch(() => null);
  version().then(running => {
    if (!running) return;
    // GAME INFO shows the published commit.
    set_build(running.trim().slice(0, 7));
    game.set_build(running.trim().slice(0, 7));
    const check = async () => {
      const now = await version();
      if (now && now !== running) { save(); location.reload(); }
    };
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 10 * 60_000);
  });

  // The dump in IndexedDB ("tama" / "files" / "dump"), or the one the player picks now.
  async function openDump() {
    const db = await new Promise((ok, fail) => {
      const r = indexedDB.open("tama", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
    });
    const tx = (mode, f) => new Promise((ok, fail) => {
      const t = db.transaction("files", mode), r = f(t.objectStore("files"));
      t.oncomplete = () => ok(r.result); t.onerror = () => fail(t.error);
    });
    const read = bytes => {
      const dump = new Dump(bytes);
      return { dump, data: dump.game_json() };
    };
    const stored = await tx("readonly", s => s.get("dump")).catch(() => null);
    if (stored) {
      try { return read(new Uint8Array(stored)); } catch (e) { console.warn("stored dump ignored:", e); }
    }
    const dlg = document.getElementById("setup"), file = document.getElementById("setup-file");
    const msg = document.getElementById("setup-msg");
    dlg.addEventListener("cancel", e => e.preventDefault());
    document.getElementById("setup-pick").onclick = () => file.click();
    dlg.showModal();
    for (;;) {
      await new Promise(ok => { file.onchange = ok; });
      const f = file.files[0];
      file.value = "";
      if (!f) continue;
      msg.textContent = "Reading…";
      const bytes = new Uint8Array(await f.arrayBuffer());
      let got;
      try { got = read(bytes); } catch (e) {
        msg.textContent = `That file does not work: ${e.message ?? e}`;
        continue;
      }
      await tx("readwrite", s => s.put(bytes.buffer, "dump")).catch(e => console.warn("dump not kept:", e));
      dlg.close();
      return got;
    }
  }
</script>
