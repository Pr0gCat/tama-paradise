<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tama Paradise</title>
<style>
  body { margin: 0; background: #222; display: grid; place-items: center; height: 100vh; gap: 12px; }
  canvas { width: min(90vw, 512px); image-rendering: pixelated; }
  button { font-size: 20px; width: 64px; }
  pre { color: #ccc; margin: 0; }
</style>
<canvas id="c"></canvas>
<div><button data-b="0">A</button> <button data-b="1">B</button> <button data-b="2">C</button></div>
<pre id="s"></pre>
<script type="module">
  import init, { Tama } from "./pkg/tama_web.js";
  await init();
  // ?speed=60 runs the pet clock 60x faster for testing.
  const speed = Number(new URLSearchParams(location.search).get("speed")) || 1;
  const localSecs = () => Date.now() / 1000 - new Date().getTimezoneOffset() * 60;
  const t0 = localSecs(), wall0 = performance.now();
  const data = await (await fetch("game.json")).text();
  const game = new Tama(data, Date.now() >>> 0);
  game.advance_to(t0);
  const w = Tama.width(), h = Tama.height(), tickMs = Tama.tick_ms();
  const c = document.getElementById("c");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const keys = { a: 0, s: 1, d: 2 };
  document.querySelectorAll("button").forEach(el => el.onclick = () => game.press(+el.dataset.b));
  addEventListener("keydown", e => e.key in keys && game.press(keys[e.key]));
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += now - last; last = now;
    const n = Math.floor(acc / tickMs);
    acc -= n * tickMs;
    if (n) {
      game.advance_to(t0 + (now - wall0) / 1000 * speed);
      document.getElementById("s").textContent = game.status();
    }
    ctx.putImageData(new ImageData(new Uint8ClampedArray(game.framebuffer()), w, h), 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
