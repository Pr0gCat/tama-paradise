<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tama Paradise</title>
<style>
  body { margin: 0; background: #222; display: grid; place-items: center; height: 100vh; gap: 12px; }
  canvas { width: min(90vw, 512px); image-rendering: pixelated; }
  button { font-size: 20px; width: 64px; }
  pre { color: #ccc; margin: 0; }
</style>
<canvas id="c"></canvas>
<div><button data-b="0">A</button> <button data-b="1">B</button> <button data-b="2">C</button></div>
<pre id="s"></pre>
<script type="module">
  import init, { Tama } from "./pkg/tama_web.js";
  await init();
  const params = new URLSearchParams(location.search);
  // ?speed=60 runs the pet clock 60x faster for testing (kept in its own save slot).
  const speed = Number(params.get("speed")) || 1;
  const KEY = speed === 1 ? "tama-save" : "tama-save-speed";
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  };
  if (params.has("reset")) store.set("");
  const localSecs = () => Date.now() / 1000 - new Date().getTimezoneOffset() * 60;
  const t0 = localSecs(), wall0 = performance.now();
  const data = await (await fetch("game.json")).text();
  let game;
  const saved = store.get();
  if (saved) {
    try { game = Tama.load(data, saved); } catch (e) { console.warn("save ignored:", e); }
  }
  game ??= new Tama(data, Date.now() >>> 0);
  game.advance_to(t0); // catches up the time the page was closed (max 24 h)
  const save = () => store.set(game.save());
  addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => document.hidden && save());
  setInterval(save, 10_000);
  const w = Tama.width(), h = Tama.height(), tickMs = Tama.tick_ms();
  const c = document.getElementById("c");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const keys = { a: 0, s: 1, d: 2 };
  const press = b => { game.press(b); save(); };
  document.querySelectorAll("button").forEach(el => el.onclick = () => press(+el.dataset.b));
  addEventListener("keydown", e => e.key in keys && press(keys[e.key]));
  // Sprites are fetched on demand; the core asks for what the current screen needs.
  const loading = new Set();
  async function loadSprite(id) {
    loading.add(id);
    try {
      const res = await fetch(`sprites/${id}.tsp.gz`);
      if (!res.ok) throw new Error(res.status);
      const raw = await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      if (!game.add_sprite(id, new Uint8Array(raw))) throw new Error("bad sprite");
    } catch (e) {
      console.warn(`sprite ${id}:`, e);  // stays in `loading`, so it is not retried every frame
      return;
    }
    loading.delete(id);
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += now - last; last = now;
    const n = Math.floor(acc / tickMs);
    acc -= n * tickMs;
    if (n) {
      game.advance_to(t0 + (now - wall0) / 1000 * speed);
      document.getElementById("s").textContent = game.status();
      for (const id of game.missing_sprites()) if (!loading.has(id)) loadSprite(id);
    }
    ctx.putImageData(new ImageData(new Uint8ClampedArray(game.framebuffer()), w, h), 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
