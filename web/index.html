<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#222">
<title>Tama Paradise</title>
<style>
  :root { --bg: #222; --btn: #3a3a44; --btn-on: #5a5a6a; --fg: #ccc; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    box-sizing: border-box; overflow: hidden;
    /* no double-tap zoom, text selection or tap flash while playing */
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  /* square screen: as large as fits next to the controls */
  canvas { width: min(92vw, 100dvh - 230px, 512px); aspect-ratio: 1; image-rendering: pixelated;
           border-radius: 12px; touch-action: none; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px 14px; justify-content: center; }
  button { height: 56px; border: 0; border-radius: 28px; background: var(--btn); color: var(--fg);
           font: 600 20px system-ui; touch-action: none; }
  button.on { background: var(--btn-on); }
  pre { margin: 0; font-size: 12px; text-align: center; min-height: 3em; }
  button.small { height: 32px; padding: 0 16px; font-size: 14px; border-radius: 16px; }
</style>
<canvas id="c" aria-label="Pet screen. Swipe left or right to turn the dial, tap to press it."></canvas>
<div class="pad">
  <button data-k="0x40" aria-label="Dial left">◀</button>
  <button data-k="0x08" aria-label="Dial press">●</button>
  <button data-k="0x80" aria-label="Dial right">▶</button>
  <button data-k="0x01">A</button>
  <button data-k="0x02">B</button>
  <button data-k="0x04">C</button>
</div>
<button id="mute" class="small" aria-pressed="false">♪ sound on</button>
<pre id="s"></pre>
<script type="module">
  import init, { Tama } from "./pkg/tama_web.js";
  await init();
  const params = new URLSearchParams(location.search);
  // ?speed=60 runs the pet clock 60x faster for testing (kept in its own save slot).
  const speed = Number(params.get("speed")) || 1;
  const KEY = speed === 1 ? "tama-save" : "tama-save-speed";
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  };
  if (params.has("reset")) store.set("");
  const localSecs = () => Date.now() / 1000 - new Date().getTimezoneOffset() * 60;
  // ?hours=N shifts the clock for testing (debug only).
  const shift = params.has("debug") ? (Number(params.get("hours")) || 0) * 3600 : 0;
  const t0 = localSecs() + shift, wall0 = performance.now();
  const data = await (await fetch("game.json")).text();
  let game;
  const saved = store.get();
  if (saved) {
    try { game = Tama.load(data, saved); } catch (e) { console.warn("save ignored:", e); }
  }
  game ??= new Tama(data, Date.now() >>> 0);
  game.advance_to(t0); // catches up the time the page was closed (max 24 h)
  const save = () => store.set(game.save());
  // ?debug: window.tama.get() returns the save as an object, window.tama.set(obj) replaces the game.
  if (params.has("debug")) {
    window.tama = {
      get: () => JSON.parse(game.save()),
      set: obj => { game = Tama.load(data, JSON.stringify(obj)); save(); },
    };
  }
  addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => document.hidden && save());
  setInterval(save, 10_000);
  const w = Tama.width(), h = Tama.height(), tickMs = Tama.tick_ms();
  const c = document.getElementById("c");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  // Input bits as in the firmware. Buttons are held; dial turns are one-frame pulses.
  // Every press is also latched for one frame, so a tap shorter than a frame still counts.
  const A = 1, B = 2, C = 4, PUSH = 8, DOWN = 0x40, UP = 0x80, DIAL = DOWN | UP;
  const keys = { a: A, s: B, d: C, " ": PUSH, Enter: PUSH, ArrowLeft: DOWN, ArrowRight: UP };
  let held = 0, pulses = 0;
  const down = bit => { pulses |= bit; if (!(bit & DIAL)) held |= bit; };
  const up = bit => { held &= ~bit; save(); };
  addEventListener("keydown", e => { if (e.key in keys && !e.repeat) { down(keys[e.key]); e.preventDefault(); } });
  addEventListener("keyup", e => e.key in keys && up(keys[e.key]));
  for (const el of document.querySelectorAll("button[data-k]")) {
    const bit = Number(el.dataset.k);
    el.onpointerdown = e => { el.setPointerCapture(e.pointerId); el.classList.add("on"); down(bit); navigator.vibrate?.(8); };
    el.onpointerup = el.onpointercancel = () => { el.classList.remove("on"); up(bit); };
    el.oncontextmenu = e => e.preventDefault();
  }
  // Touch screen: swipe sideways turns the dial (one step per 24 px), a tap presses it.
  let swipeX = null, swiped = false;
  c.onpointerdown = e => { c.setPointerCapture(e.pointerId); swipeX = e.clientX; swiped = false; };
  c.onpointermove = e => {
    if (swipeX === null) return;
    const dx = e.clientX - swipeX;
    if (Math.abs(dx) >= 24) { down(dx > 0 ? UP : DOWN); swipeX = e.clientX; swiped = true; }
  };
  c.onpointerup = () => {
    if (swipeX !== null && !swiped) { down(PUSH); up(PUSH); }
    swipeX = null;
  };
  c.onpointercancel = () => { swipeX = null; };
  // Sound: the original is a single-voice buzzer playing square-wave melodies (10% duty).
  const melodies = JSON.parse(data).melodies ?? [];
  let audio = null, voice = null;
  let muted = (() => { try { return localStorage.getItem("tama-muted") === "1"; } catch { return false; } })();
  const muteBtn = document.getElementById("mute");
  const showMute = () => { muteBtn.textContent = muted ? "♪ sound off" : "♪ sound on"; muteBtn.setAttribute("aria-pressed", muted); };
  showMute();
  muteBtn.onclick = () => {
    muted = !muted; showMute();
    try { localStorage.setItem("tama-muted", muted ? "1" : "0"); } catch {}
    if (muted) voice?.osc.stop();
  };
  // Browsers only allow audio after a user gesture.
  const unlock = () => { audio ??= new AudioContext(); audio.resume(); };
  addEventListener("pointerdown", unlock); addEventListener("keydown", unlock);
  function pulseWave(duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = 2 * Math.sin(Math.PI * k * duty) / (Math.PI * k);
    return audio.createPeriodicWave(re, im);
  }
  function playMelody(id, vol) {
    const m = melodies[id];
    if (!m || !audio || muted || audio.state !== "running") return;
    voice?.osc.stop();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.setPeriodicWave(pulseWave(0.1));
    osc.connect(gain).connect(audio.destination);
    let t = audio.currentTime + 0.01;
    for (const [steps, period, duty] of m.notes) {
      const on = period > 0 && duty > 0;
      if (on) osc.frequency.setValueAtTime(1e6 / period, t);
      gain.gain.setValueAtTime(on ? 0.25 * vol / 100 : 0, t);
      t += steps * m.ms_per_step / 1000;
    }
    osc.start(); osc.stop(t);
    voice = { osc };
  }

  // Sprites are fetched on demand; the core asks for what the current screen needs.
  const loading = new Set();
  async function loadSprite(id) {
    loading.add(id);
    try {
      const res = await fetch(`sprites/${id}.tsp.gz`);
      if (!res.ok) throw new Error(res.status);
      const raw = await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      if (!game.add_sprite(id, new Uint8Array(raw))) throw new Error("bad sprite");
    } catch (e) {
      console.warn(`sprite ${id}:`, e);  // stays in `loading`, so it is not retried every frame
      return;
    }
    loading.delete(id);
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += now - last; last = now;
    const n = Math.floor(acc / tickMs);
    acc -= n * tickMs;
    if (n) {
      const t = t0 + (now - wall0) / 1000 * speed;
      for (let i = 0; i < Math.min(n, 5); i++) { game.frame(t, held | pulses); pulses = 0; }
      document.getElementById("s").textContent = game.status();
      for (const id of game.missing_sprites()) if (!loading.has(id)) loadSprite(id);
      const sounds = game.take_sounds();
      if (sounds.length) { const s = sounds[sounds.length - 1]; playMelody(s >> 8, s & 0xff); }
    }
    ctx.putImageData(new ImageData(new Uint8ClampedArray(game.framebuffer()), w, h), 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
